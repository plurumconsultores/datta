<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Radar de mis Estados · Cultura GEB</title>
<style>
:root{
  --navy:#091539; --azul:#26376F; --oro:#C89538; --arena:#F2DE93;
  --navy-1:#050D26; --azul-2:#3C55A3;
  --grad:linear-gradient(100deg,#091539 0%,#26376F 58%,#3C55A3 100%);
  --grad-v:linear-gradient(180deg,#091539,#3C55A3);
  --tinta:#141B33; --tinta-suave:#5C6478; --tinta-tenue:#6F7890;
  --linea:#E2E6EE; --linea-2:#EEF1F6;
  --sombra:0 1px 2px rgba(9,21,57,.06),0 10px 30px rgba(9,21,57,.12);
  --radio:16px;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:#F2F5F9;color:var(--tinta);line-height:1.45;font-size:16px;
  -webkit-font-smoothing:antialiased;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 480px at 88% -8%,rgba(38,55,111,.20),transparent 62%),
             radial-gradient(760px 420px at -12% 108%,rgba(9,21,57,.16),transparent 60%),#F2F5F9}

/* ---------- Encabezado ---------- */
header.top{background:var(--grad);position:relative;padding:13px 0;box-shadow:0 6px 22px rgba(9,21,57,.30)}
header.top::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(520px 140px at 14% 125%,rgba(255,255,255,.16),transparent 70%)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--oro) 30%,var(--arena) 55%,var(--oro) 80%,transparent)}
.head-in{max-width:660px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px;
  justify-content:space-between;position:relative}
header.top h1{color:#fff;font-size:18px;font-weight:800;margin:0;letter-spacing:.2px;line-height:1.25}
header.top .h1sub{display:block;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.78);margin-top:2px}
header.top .h1src{display:block;font-size:10.5px;font-weight:500;color:rgba(242,222,147,.85);margin-top:2px;font-style:italic}
#corp-logo{height:42px;width:auto;background:#fff;border-radius:10px;padding:6px 10px;flex:none;
  box-shadow:0 3px 14px rgba(0,0,0,.22)}

/* ---------- Estructura ---------- */
.wrap{max-width:660px;margin:0 auto;padding:16px 16px 34px}
.prog{height:8px;border-radius:5px;background:#E1E7F0;overflow:hidden;box-shadow:inset 0 1px 2px rgba(9,21,57,.10)}
.prog i{display:block;height:100%;width:0;border-radius:5px;transition:width .35s;
  background:linear-gradient(90deg,var(--azul-2),var(--oro))}
.paso{font-size:11.5px;color:var(--tinta-suave);font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  margin:9px 0 12px}
.card{background:#fff;border-radius:var(--radio);box-shadow:var(--sombra);padding:20px 20px 22px;
  position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad-v)}
.card::after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;
  background:rgba(38,55,111,.08);pointer-events:none}
.card.oro::before{background:linear-gradient(180deg,var(--oro),var(--arena))}
.in{position:relative;z-index:1}
h2{margin:0 0 6px;font-size:20.5px;color:var(--navy);line-height:1.3;font-weight:800;letter-spacing:-.2px}
.sub{color:var(--tinta-suave);font-size:14.5px;margin:0 0 16px}
h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);
  font-weight:800;padding-bottom:6px;border-bottom:1px solid var(--linea)}
h3:not(:first-child){margin-top:20px}

/* ---------- Datos demográficos ---------- */
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
.campo select{width:100%;font:inherit;font-size:16px;color:var(--tinta);background:#FAFBFD;
  border:2px solid var(--linea);border-radius:12px;padding:13px 40px 13px 14px;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6' fill='none' stroke='%2326376F' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:20px}
.campo select:focus{outline:3px solid var(--oro);outline-offset:2px;border-color:var(--azul-2)}
.campo select.lleno{border-color:var(--azul-2);background-color:#F2F6FD}

/* ---------- Opciones ---------- */
.ops{display:flex;flex-direction:column;gap:10px}
.op{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#FAFBFD;
  border:2px solid var(--linea);border-radius:13px;padding:14px 15px;font:inherit;font-size:15.5px;
  color:var(--tinta);cursor:pointer;transition:.15s;line-height:1.4}
.op:hover{border-color:var(--azul-2);background:#F4F7FC}
.op:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.op.sel{border-color:var(--azul-2);background:#EEF3FC}
.op b{flex:none;width:27px;height:27px;border-radius:8px;background:var(--azul);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800}
.op.sel b{background:linear-gradient(135deg,var(--oro),#E0B659);color:var(--navy)}

/* ---------- Botones y avisos ---------- */
.nav{display:flex;gap:10px;margin-top:18px;align-items:center}
button.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 24px;cursor:pointer;
  background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(9,21,57,.22)}
button.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
button.sec{background:#EDF0F6;color:var(--navy);box-shadow:none}
.nota-indep{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;background:rgba(38,55,111,.08);
  border-left:4px solid var(--azul-2);border-radius:9px;padding:11px 14px;font-size:12.8px;
  color:#3B4457;line-height:1.5}
.nota-indep svg{width:17px;height:17px;color:var(--azul-2);flex-shrink:0;margin-top:1px}
.nota-indep b{color:var(--navy)}

/* ---------- Resultado ---------- */
.res-top{background:var(--grad);color:#fff;margin:-20px -20px 18px;padding:26px 20px 22px;text-align:center;
  position:relative;overflow:hidden}
.res-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--oro) 30%,var(--arena) 55%,var(--oro) 80%,transparent)}
.res-top .et{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(242,222,147,.92);font-weight:700}
.res-top h2{color:#fff;font-size:31px;margin:7px 0 8px;letter-spacing:-.6px}
.res-top p{margin:0;color:rgba(255,255,255,.88);font-size:15px}
.res-top .cnt{display:flex;justify-content:center;gap:7px;margin-top:15px;flex-wrap:wrap}
.res-top .cnt span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
ul.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
ul.tips li{display:flex;gap:10px;font-size:15.5px;line-height:1.45}
ul.tips li::before{content:"";flex:none;width:9px;height:9px;border-radius:3px;background:var(--oro);margin-top:7px}
.cierre{margin:22px -20px -22px;background:linear-gradient(100deg,var(--oro),#E0B659 58%,var(--arena));
  color:var(--navy);padding:15px 20px 18px;text-align:center}
.cierre b{display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;
  text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.cierre span{display:block;font-size:14.5px;font-weight:700;color:rgba(9,21,57,.78);margin-top:4px}
.estado{font-size:13px;color:var(--tinta-suave);margin:16px 0 0;text-align:center}
.estado.err{color:#A3341F;font-weight:600}
.pie{max-width:660px;margin:0 auto;padding:0 16px 26px;display:flex;justify-content:center;
  font-size:11.5px;color:var(--tinta-tenue)}
@media (max-width:420px){.wrap{padding:14px 12px 28px}.card{padding:17px 15px 19px}h2{font-size:19px}
  .res-top{margin:-17px -15px 16px}.cierre{margin:20px -15px -19px}header.top h1{font-size:16px}}
</style>
</head>

 "Complacencia":"Tu cerebro opera en piloto automático.",
 "Fatiga":"Tus reflejos y tu capacidad de respuesta están disminuidos."
};
const SENALES = {
 "Prisa":["Trabajar más rápido de lo normal","Omitir pasos o verificaciones","Sentir impaciencia o presión por terminar"],
 "Frustración":["Irritación, enojo o tensión","Discutir o culpar a otros","Tener la atención cerrada en el problema"],
 "Complacencia":["Trabajar en piloto automático","Pensar que nada puede salir mal","Tomar atajos porque la tarea parece conocida"],
 "Fatiga":["Bostezos, sueño o cansancio","Reacciones más lentas","Olvidos, distracciones o dificultad para concentrarse"]
};
const CONSEJOS = {
 "Prisa":["Antes de acelerar, detente diez segundos: ¿qué paso me estaría saltando?",
   "Llegar a tiempo nunca vale más que volver a casa. Planea tu tarea con margen.",
   "Si sientes que el reloj te empuja, di en voz alta el siguiente paso antes de hacerlo.",
   "Las verificaciones no son opcionales: son las que te devuelven a casa.",
   "Cuando el tiempo no alcance, pide apoyo o renegocia el plazo.",
   "Mente en la tarea de ahora, no en todo lo que falta.",
   "Si vas demasiado rápido, respira; pausar protegerá tu buen trabajo.",
   "Evita los atajos: cuidar el proceso protege tus buenos resultados.",
   "Ante la urgencia, pausa y prioriza; si te supera, pide ayuda."],
 "Frustración":["Cuando algo no sale como esperas, respira antes de reaccionar.",
   "Una pausa corta hoy evita un error grande mañana.",
   "Conversa lo que te molesta con respeto: lo que no se resuelve, distrae.",
   "Busca la solución, no al culpable.",
   "Si la tensión sube, amplía la mirada y revisa tu entorno antes de seguir.",
   "Ponle nombre a lo que sientes: así la emoción no decide por ti.",
   "Elige escuchar antes de discutir; la empatía desarma los conflictos.",
   "Si el problema te nubla, pide otras opiniones para ampliar tu perspectiva.",
   "Aprende a decir no cuando tu capacidad de trabajo esté al límite."],
 "Fatiga":["Descansar también es parte de trabajar seguro.",
   "Haz pausas activas: hidrátate y mueve el cuerpo.",
   "Si te cuesta concentrarte, avisa y rota la tarea.",
   "Cuida tu sueño: dormir bien es tu primera protección.",
   "En tareas críticas, pide que un compañero verifique contigo.",
   "Ajusta el ritmo a tu energía a lo largo de la jornada.",
   "Descansa mínimo siete horas para recuperar tu energía plena.",
   "Come e hidrátate cada tres o cuatro horas: evita caídas de energía y mejora la concentración.",
   "Abre espacios diarios para desconectar del trabajo con pasatiempos breves que relajen tu mente."],
 "Complacencia":["Haz cada tarea como si fuera la primera vez.",
   "Lo conocido también cambia: revisa antes de asumir.",
   "Apaga el piloto automático: busca un detalle nuevo en tu entorno.",
   "Los atajos de hoy son los incidentes de mañana.",
   "Completa la lista de chequeo, aunque la sepas de memoria.",
   "Pregúntate siempre: ¿qué podría salir mal esta vez?",
   "Evita el exceso de confianza: verifica tus tareas paso a paso.",
   "Pide retroalimentación frecuente para descubrir puntos ciegos y seguir mejorando.",
   "Busca aprender algo diferente cada semana para desactivar el piloto automático."]
};
/* ================================================= */

const LETRAS=["A","B","C","D","E"];
const T=document.getElementById("tarjeta"), BARRA=document.getElementById("barra"), PASO=document.getElementById("paso");
let filial=null, genero=null, resp=new Array(PREGUNTAS.length).fill(null), i=-1, empatados=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avance=p=>BARRA.style.width=Math.max(0,Math.min(100,p))+"%";

function portada(){
  PASO.textContent="Antes de empezar";avance(0);
  T.className="card";
  T.innerHTML=`<div class="in">
    <h2>Un minuto para reconocerte</h2>
    <p class="sub">Nueve situaciones de trabajo. Elige la opción que mejor describe tu reacción habitual cuando estás bajo presión. No hay respuestas buenas ni malas: lo único que importa es que respondas con honestidad.</p>
    <h3>Cuéntanos de ti</h3>
    <div class="campo"><label for="selFilial">Filial</label>
      <select id="selFilial"><option value="">Selecciona tu filial</option>
        ${FILIALES.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("")}</select></div>
    <div class="campo"><label for="selGenero">Género</label>
      <select id="selGenero"><option value="">Selecciona una opción</option>
        ${GENEROS.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("")}</select></div>
    <div class="nav"><button class="btn" id="empezar" disabled>Empezar</button></div>
    <div class="nota-indep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <div><b>Es anónima.</b> No pedimos tu nombre ni tu correo. Solo se guardan tu filial, tu género y el estado que resulte, para alimentar el tablero de la jornada.</div>
    </div></div>`;
  const sf=document.getElementById("selFilial"), sg=document.getElementById("selGenero"),
        bt=document.getElementById("empezar");
  const rev=()=>{
    filial=sf.value||null; genero=sg.value||null;
    sf.classList.toggle("lleno",!!filial); sg.classList.toggle("lleno",!!genero);
    bt.disabled=!(filial&&genero);
  };
  sf.onchange=rev; sg.onchange=rev; rev();
  bt.onclick=()=>{i=0;pregunta()};
}

function pregunta(){
  const [txt,ops]=PREGUNTAS[i];
  PASO.textContent=`Pregunta ${i+1} de ${PREGUNTAS.length}`;
  avance(i/PREGUNTAS.length*100);
  T.className="card";
  T.innerHTML=`<div class="in"><h2>${esc(txt)}</h2><p class="sub">Elige la opción que más se parece a ti</p>
    <div class="ops">${ops.map((o,k)=>`<button class="op${resp[i]===LETRAS[k]?" sel":""}" data-k="${k}"><b>${LETRAS[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="nav">${i>0?'<button class="btn sec" id="atras">Atrás</button>':""}</div></div>`;
  T.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    resp[i]=LETRAS[+b.dataset.k];
    T.querySelectorAll("[data-k]").forEach(o=>o.classList.toggle("sel",o===b));
    setTimeout(()=>{ i<PREGUNTAS.length-1 ? (i++,pregunta()) : cerrar(); },180);
  });
  const a=document.getElementById("atras"); if(a)a.onclick=()=>{i--;pregunta()};
  window.scrollTo({top:0,behavior:"smooth"});
}

const conteo=()=>{const c={A:0,B:0,C:0,D:0,E:0};resp.forEach(l=>{if(l)c[l]++});return c};
const conteoEstado=()=>{const c=conteo(),e={};ESTADOS.forEach(x=>e[x]=0);
  LETRAS.forEach(l=>{e[LETRA_ESTADO[l]]+=c[l]});return e};

function cerrar(){
  const e=conteoEstado(), mx=Math.max(...ESTADOS.map(x=>e[x]));
  const top=ESTADOS.filter(x=>e[x]===mx);
  top.length>1 ? (empatados=top, desempate()) : resultado(top[0]);
}

function desempate(){
  PASO.textContent="Casi listo";avance(96);
  T.className="card oro";
  T.innerHTML=`<div class="in"><h2>Quedaste en empate</h2>
    <p class="sub">Marcaste la misma cantidad de opciones en más de un estado. ¿Con cuál te identificas más en tu día a día?</p>
    <div class="ops">${empatados.map(e=>`<button class="op" data-e="${esc(e)}"><b>·</b><span><strong>${esc(e)}</strong><br><span style="color:var(--tinta-suave);font-size:14px">${esc(FRASE[e])}</span></span></button>`).join("")}</div></div>`;
  T.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>resultado(b.dataset.e));
}

function resultado(estado){
  PASO.textContent="Tu resultado";avance(100);
  const c=conteoEstado();
  T.className="card oro";
  T.innerHTML=`<div class="res-top">
      <div class="et">Tu estado predominante</div>
      <h2>${esc(estado)}</h2>
      <p>${esc(FRASE[estado])}</p>
      <div class="cnt">${ESTADOS.map(x=>`<span>${esc(x)} · ${c[x]}</span>`).join("")}</div>
    </div>
    <div class="in">
    <h3>Señales para identificarlo</h3>
    <ul class="tips">${SENALES[estado].map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
    <h3>Qué hacer cuando lo sientas</h3>
    <ul class="tips">${CONSEJOS[estado].map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
    <p class="estado" id="envio">Guardando tu respuesta…</p>
    </div>
    <div class="cierre">
      <b><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z" fill="#091539"><animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.2s" additive="sum" repeatCount="indefinite"/></path></svg>Primero la Vida</b>
      <span>Mente en calma, acción segura</span>
    </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
  enviar(estado);
}

async function enviar(estado){
  const caja=document.getElementById("envio");
  const cuerpo={filial:filial,genero:genero,estado:estado,
    respuestas:{letras:resp.slice(),conteo:conteo(),estados:conteoEstado(),version:"radar-geb-9p-e"}};
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY){
    caja.textContent="Modo de prueba: la respuesta no se guardó (falta configurar la base).";return;
  }
  try{
    const r=await fetch(SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/respuestas_radar",
      {method:"POST",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(cuerpo)});
    if(!r.ok)throw new Error(r.status);
    caja.className="estado";caja.textContent="Listo: tu respuesta ya cuenta en el tablero de la jornada.";
  }catch(e){
    caja.className="estado err";
    caja.innerHTML='No pudimos guardar tu respuesta. <button class="btn sec" style="padding:7px 14px;margin-left:8px" id="rein">Reintentar</button>';
    document.getElementById("rein").onclick=()=>{caja.className="estado";caja.textContent="Guardando tu respuesta…";enviar(estado)};
  }
}

portada();
</script>
</body>
</html>
