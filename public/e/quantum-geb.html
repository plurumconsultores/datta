:root{--azul:#0931C6;--azul2:#1A3ED3;--navy:#071575;--navy2:#000967;--card:#384088;--naranja:#F89048;--ambar:#F7B23B;--cian:#00B8F8;--lima:#A0D800;
  --gris:#E8E8EC;--tinta:#10163F;--suave:#5C6385;--linea:#DCDDE6;--ok:#3E9E3A;--aj:#F2A516;--no:#E0474C;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;--sombra:0 1px 2px rgba(7,21,117,.08),0 10px 28px rgba(7,21,117,.14)}
*{box-sizing:border-box}
html,body{margin:0;background:#EEF0F6;color:var(--tinta);font-family:var(--font);font-size:16.5px;line-height:1.42;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 480px at 90% -10%,rgba(9,49,198,.22),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(0,184,248,.14),transparent 60%),#EEF0F6}
header.top{background:linear-gradient(110deg,#000967 0%,#0931C6 60%,#1A3ED3 100%);position:relative;padding:12px 0 14px;box-shadow:0 6px 22px rgba(0,9,103,.35);overflow:hidden}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--lima),var(--cian) 45%,var(--naranja))}
header.top::before{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;border:1.5px solid rgba(160,216,0,.55);pointer-events:none}
.head-in{max-width:640px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
header h1{color:#fff;margin:0;font-size:18px;font-weight:800;font-style:italic;line-height:1.2}
header h1 span{display:block;font-size:11.5px;font-style:normal;font-weight:600;color:rgba(255,255,255,.8);margin-top:2px}
#logo{height:34px;width:auto;flex:none}
main{max-width:640px;margin:0 auto;padding:14px 14px 70px}
.card{background:#fff;border-radius:16px;padding:18px 18px 18px 22px;margin:0 0 14px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--azul),var(--cian))}
.card.nar::before{background:linear-gradient(180deg,var(--naranja),var(--ambar))}
.kick{font-size:12px;font-weight:800;font-style:italic;color:var(--naranja);letter-spacing:.02em;margin:0 0 3px}
.kick b{display:inline-block;font-style:normal;background:var(--cian);color:#fff;border-radius:999px;padding:2px 9px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;vertical-align:1px}
h2{font-size:21px;line-height:1.2;color:var(--navy);margin:0 0 8px;font-weight:800;font-style:italic}
h3{font-size:16px;color:var(--navy);margin:0 0 6px}
p{margin:0 0 10px}.muted{color:var(--suave);font-size:15px}
label.f{display:block;font-weight:700;font-size:14.5px;margin:12px 0 6px;color:var(--navy)}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;border:1.5px solid #CDD0DE;border-radius:12px;padding:11px 12px;background:#FAFBFF;color:var(--tinta)}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(9,49,198,.15)}
.cnt{font-size:12px;color:var(--suave);text-align:right;margin-top:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:800 16px var(--font);background:linear-gradient(110deg,#071575,#0931C6);color:#fff;cursor:pointer;margin-top:16px}
.btn.nar{background:linear-gradient(110deg,#F7883A,#F7B23B);color:#10163F}
.btn.ghost{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:13px;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #CDD0DE;background:#FAFBFF;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;color:var(--navy);font-size:15px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pin{border:2px solid #CDD0DE;background:#fff;border-radius:14px;padding:10px 4px;cursor:pointer;text-align:center;font-weight:800;color:var(--navy);font-size:13px}
.pin i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pin.on{border-color:var(--navy);box-shadow:0 0 0 3px rgba(7,21,117,.2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid #CDD0DE;background:#FAFBFF;border-radius:10px;padding:10px 4px;font:700 13px var(--font);color:var(--suave);cursor:pointer}
.seg button.on.C,.seg button.on.S{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.A,.seg button.on.D{background:var(--aj);border-color:var(--aj);color:#10163F}
.seg button.on.N{background:var(--no);border-color:var(--no);color:#fff}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.scale button{border:1.5px solid #CDD0DE;background:#FAFBFF;border-radius:12px;padding:12px 0;font:800 18px var(--font);color:var(--navy);cursor:pointer}
.scale button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--suave);margin-top:4px}
.item{border-top:1px solid var(--linea);padding:14px 0 6px}.item:first-of-type{border-top:0}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--naranja);color:#fff;font:800 italic 14px var(--font);margin-right:8px;flex:none}
.q{display:flex;align-items:flex-start;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.two button{border:1.5px solid #CDD0DE;background:#FAFBFF;border-radius:12px;padding:12px 8px;font:800 14px var(--font);color:var(--navy);cursor:pointer}
.two button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;margin-bottom:10px;scrollbar-width:none}
.tab{flex:none;border:1.5px solid #CDD0DE;background:#fff;border-radius:12px;padding:8px 11px;font:700 13px var(--font);color:var(--navy);cursor:pointer;position:relative}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab.done::after{content:"✓";position:absolute;top:-7px;right:-6px;background:var(--ok);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.ficha{background:linear-gradient(150deg,#071575,#0931C6);color:#fff;border-radius:14px;padding:16px;margin-bottom:6px}
.ficha .cod{font:800 12px var(--font);color:var(--ambar);letter-spacing:.08em}
.ficha h3{color:#fff;font-size:18px;margin:4px 0 6px;font-style:italic}
.ficha details{font-size:14.5px;color:#DDE3FF;margin-top:6px}.ficha summary{cursor:pointer;color:#fff;font-weight:700}
.ficha ol{margin:8px 0 0;padding-left:18px}.ficha li{margin:4px 0}
.crit{border:1px solid var(--linea);border-radius:12px;padding:12px;margin-top:10px;background:#FAFBFF}
.crit .t{font-weight:800;color:var(--navy)}.crit .p{font-size:14px;color:var(--suave);margin-bottom:8px}
.crit input{margin-top:8px}
.carta{border:1.5px solid var(--linea);border-radius:14px;padding:14px;margin-top:12px;background:#fff}
.carta .cod{font:800 12px var(--font);color:var(--naranja)}
.carta .near{font-size:13px;color:var(--suave)}
.row5{display:grid;grid-template-columns:1fr 160px;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--linea);font-size:14px}
.row5 .seg button{padding:7px 2px;font-size:12px}
.si{font:800 12px var(--font);color:var(--ok);margin-top:8px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--azul);background:#fff;color:var(--azul);font:800 18px var(--font);cursor:pointer}
.stepper b{min-width:22px;text-align:center;font:800 20px var(--font);color:var(--navy)}
.pozo{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--navy);color:#fff;border-radius:14px;padding:12px;position:sticky;top:8px;z-index:3;margin-bottom:12px}
.fp{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFD38A,#F7883A 60%,#B9561A);border:3px dashed rgba(255,255,255,.8);display:inline-block}
.fp.off{background:#384088;opacity:.45}
.fichas-carta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--linea)}
.mesa-box{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--sombra)}
.mesa-box .dot{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.mesa-box b{color:var(--navy)}.mesa-box small{display:block;color:var(--suave);font-size:12.5px}
.who{flex:1;min-width:0}
.lider{font-size:12px;font-weight:800;color:var(--naranja);white-space:nowrap}
.miembros{margin:8px 0 0;padding:0;list-style:none}
.miembros li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--linea);font-size:14.5px}
.miembros li span{color:var(--suave);font-size:13px}
.wait{text-align:center;padding:26px 18px}
.wait .big{font:800 italic 22px var(--font);color:var(--navy);margin:10px 0 6px}
.spark{width:84px;height:84px;margin:0 auto}
.err{color:var(--no);font-weight:700;font-size:14px;margin-top:10px}
.ok-msg{background:#E8F5E4;border:1px solid #9BD08E;color:#265E1F;border-radius:12px;padding:9px 12px;font-size:14px;margin-bottom:12px}
.demo{background:#FFF1DC;border:1px dashed var(--naranja);color:#7A4310;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.nav button{border:1px solid #CDD0DE;background:#fff;border-radius:999px;padding:6px 11px;font:700 12px var(--font);color:var(--navy);cursor:pointer}
.nav button.on{background:var(--naranja);border-color:var(--naranja);color:#fff}
.estado{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--suave);margin:0 0 10px}
.estado i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.estado.off i{background:var(--no)}
footer{text-align:center;color:var(--suave);font-size:12px;padding:10px 0 30px}
</style>
</head>

 {id:'QC-01',n:'Pasión por el logro',pr:'Convertir compromisos en resultados que generan valor.',d:'Capacidad para asumir compromisos y orientar las propias actuaciones hacia el logro de resultados que generan valor para GEB y sus filiales. Implica establecer prioridades, gestionar obstáculos, tomar decisiones informadas dentro del ámbito de responsabilidad y mejorar continuamente la forma de trabajar, manteniendo la calidad, la eficiencia y los compromisos adquiridos.',
  niv:['Cumple compromisos simples con orientación.','Gestiona prioridades y resultados habituales.','Responde autónomamente por resultados y desviaciones.','Resuelve barreras complejas y mejora la ejecución de otros.','Establece referentes transferibles de logro y ejecución.']},
 {id:'QC-02',n:'Desarrollo propio y de otros',pr:'Convertir el aprendizaje en capacidades aplicadas y compartidas.',d:'Capacidad para reconocer y gestionar las propias necesidades de aprendizaje, adquirir y aplicar conocimientos y habilidades relevantes, y contribuir al desarrollo de otras personas mediante retroalimentación, intercambio de experiencias y transferencia de conocimiento. Implica convertir el aprendizaje en mejoras demostrables de la actuación y en capacidades que puedan ser aprovechadas por otros.',
  niv:['Aprende y aplica retroalimentación con orientación.','Gestiona su aprendizaje habitual.','Desarrolla capacidades propias y comparte conocimiento autónomamente.','Desarrolla a otros ante necesidades complejas.','Establece prácticas transferibles de desarrollo y aprendizaje.']},
 {id:'QC-03',n:'Trabajo colaborativo e inclusivo',pr:'Integrar capacidades diversas para generar resultados compartidos.',d:'Capacidad para contribuir al logro de objetivos compartidos mediante relaciones de trabajo respetuosas, coordinación de esfuerzos e integración de conocimientos, capacidades y perspectivas diversas. Implica cumplir compromisos colectivos, favorecer la participación inclusiva, abordar barreras que dificultan la colaboración y construir soluciones conjuntas entre personas, equipos, procesos y empresas.',
  niv:['Participa con respeto e inclusión.','Coordina actividades e incorpora perspectivas diversas.','Integra capacidades y resuelve barreras de colaboración.','Articula actores ante interdependencias complejas.','Establece prácticas transferibles de colaboración e inclusión.']},
 {id:'QC-04',n:'Movilizador del cambio',pr:'Convertir los cambios necesarios en prácticas comprendidas y adoptadas.',d:'Capacidad para contribuir a la comprensión, adopción y materialización de cambios que respondan a nuevas necesidades del negocio y su entorno. Implica reconocer oportunidades de ajuste, modificar prácticas dentro del propio ámbito, comunicar y clarificar nuevas condiciones, colaborar con otros durante la transición y convertir los aprendizajes del cambio en mejoras sostenibles.',
  niv:['Comprende y adopta cambios con orientación.','Aplica y comunica ajustes habituales.','Implementa cambios y facilita su adopción autónomamente.','Resuelve dificultades complejas de adopción del cambio.','Establece prácticas transferibles de adaptación colectiva.']},
 {id:'QC-05',n:'Innovación y Pensamiento digital',pr:'Transformar oportunidades en soluciones innovadoras con potencial digital pertinente.',d:'Capacidad para identificar oportunidades de mejora y creación de valor mediante el cuestionamiento de prácticas existentes, la generación y aplicación de soluciones nuevas o significativamente mejoradas y el aprovechamiento crítico y responsable de datos, información y tecnologías digitales cuando sean pertinentes. Implica experimentar, verificar resultados y transferir aprendizajes para mejorar productos, servicios, procesos y formas de trabajo.',
  niv:['Reconoce oportunidades de innovación y uso digital con orientación.','Aplica mejoras y recursos digitales en situaciones habituales.','Implementa soluciones innovadoras y digitales autónomamente.','Resuelve desafíos complejos mediante innovación y pensamiento digital.','Establece referentes de innovación y pensamiento digital transferibles.']}];

function demoRows(){try{return JSON.parse(localStorage.getItem('quantum_demo_rows'))||[];}catch(e){return [];}}
function demoCtrl(){try{return JSON.parse(localStorage.getItem('quantum_demo_control'))||{actual:'registro',volver:false};}catch(e){return {actual:'registro',volver:false};}}
function estadoDesde(rows){ // misma lógica que la función quantum_estado() de Supabase
  var mb={},ld={},gr={},mias={};
  rows.forEach(function(r){
    if(r.actividad==='registro'&&(!mb[r.pid]||mb[r.pid].creado_en<=r.creado_en))mb[r.pid]={pid:r.pid,nombre:r.nombre,filial:r.filial,cargo:(r.datos||{}).cargo,mesa:r.mesa,creado_en:r.creado_en};
    if(r.actividad==='lider'&&(!ld[r.mesa]||ld[r.mesa].creado_en<=r.creado_en))ld[r.mesa]={pid:r.pid,nombre:r.nombre,creado_en:r.creado_en};
    if(['conexion','core','horizon'].indexOf(r.actividad)>=0)gr[r.actividad+'|'+r.mesa+'|'+((r.datos||{}).comp||'')]=1;
    if(r.pid===PID)mias[r.actividad+'|'+(r.momento||'')]=1;});
  return {miembros:Object.keys(mb).map(function(k){return mb[k];}),lideres:ld,grupales:Object.keys(gr).map(function(k){var p=k.split('|');return {a:p[0],m:+p[1],c:p[2]||null};}),mias:Object.keys(mias)};
}
function consultar(){
  if(DEMO){CTRL=demoCtrl();EST=estadoDesde(demoRows());CONECTADO=true;return Promise.resolve();}
  return fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/quantum_estado',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pid:PID})})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
   .then(function(j){CTRL=j.control||CTRL;EST={miembros:j.miembros||[],lideres:j.lideres||{},grupales:j.grupales||[],mias:j.mias||[]};CONECTADO=true;})
   .catch(function(){CONECTADO=false;});
}
function enviar(fila){
  fila.pid=PID;
  if(DEMO){var r=demoRows();fila.id='d'+Date.now()+Math.random();fila.creado_en=new Date().toISOString();r.push(fila);localStorage.setItem('quantum_demo_rows',JSON.stringify(r));return new Promise(function(ok){setTimeout(ok,300);});}
  return fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+TABLA,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(fila)})
   .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||r.status);});});
}

var DRAFT_KEY=null, SEL={};
function draftKey(){return 'draft_'+DRAFT_KEY;}
function guardarBorrador(){if(!DRAFT_KEY)return;var d={v:{},sel:SEL};[].forEach.call(app.querySelectorAll('input[id],textarea[id],select[id]'),function(e){d.v[e.id]=e.value;});ls(draftKey(),d);}
function restaurarBorrador(){if(!DRAFT_KEY)return;var d=ls(draftKey());SEL=(d&&d.sel)||{};
  if(d&&d.v)Object.keys(d.v).forEach(function(id){var e=document.getElementById(id);if(e&&!e.value)e.value=d.v[id];if(e&&e.oninput)e.oninput();});
  [].forEach.call(app.querySelectorAll('[data-g]'),function(b){var g=SEL[b.dataset.g];if(g&&String(g[b.dataset.k])===b.dataset.v)b.classList.add('on');});
  if(window.trasRestaurar)window.trasRestaurar();}
app.addEventListener('input',guardarBorrador);app.addEventListener('change',guardarBorrador);
function opt(g,k,v,label,cls){return '<button type="button" class="'+(cls||'')+'" data-g="'+g+'" data-k="'+k+'" data-v="'+v+'" onclick="elegir(this)">'+label+'</button>';}
window.elegir=function(b){var g=b.dataset.g,k=b.dataset.k,v=b.dataset.v;SEL[g]=SEL[g]||{};SEL[g][k]=v;[].forEach.call(b.parentNode.querySelectorAll('[data-g="'+g+'"][data-k="'+k+'"]'),function(x){x.classList.toggle('on',x===b);});guardarBorrador();if(window.trasElegir)window.trasElegir(g,k,v);};

  h(intro+'<div class="card">'+tabs+'<div class="ficha"><div class="cod">'+c.id+'</div><h3>'+esc(c.n)+'</h3><div style="color:#FFD9A6;font-size:14px">'+esc(c.pr)+'</div><details><summary>Definición</summary><p style="margin-top:8px">'+esc(c.d)+'</p></details><details open><summary>Los cinco niveles</summary><ol>'+c.niv.map(function(t,i){return '<li><b>'+NIVN[i]+'</b> · '+esc(t)+'</li>';}).join('')+'</ol></details></div>'+
   CRIT.map(function(k,i){return '<div class="crit"><div class="t">'+(i+1)+'. '+k.n+'</div><div class="p">'+esc(k.p)+'</div><div class="seg">'+opt('c',k.k,'C','Cumple','C')+opt('c',k.k,'A','Cumple con ajustes','A')+opt('c',k.k,'N','No cumple','N')+'</div><input type="text" id="s_'+k.k+'" maxlength="220" placeholder="Por qué y nivel (ej.: '+c.id+' nivel 3)"></div>';}).join('')+
   pie('Enviar '+c.id)+'</div>');
  DRAFT_KEY='core_'+c.id;restaurarBorrador();};
window.coreTab=function(i){CI=i;ls('core_tab',i);render(true);};
R.horizon=function(s){
  if(grupalBloqueada(s))return;
  function fichas(){var F=(SEL.f||{}),t=0;HZ.forEach(function(h){t+=+(F[h.id]||0);});return t;}
  function pozo(){var t=fichas(),x='';for(var i=0;i<3;i++)x+='<span class="fp'+(i<3-t?'':' off')+'"></span>';return x+'<b>'+(3-t)+' ficha'+(3-t===1?'':'s')+' por apostar</b>';}
  function cuentaSi(id){var q=SEL['hq_'+id]||{},n=0;for(var i=0;i<5;i++)if(q[i]==='S')n++;return n;}
  window.hzStep=function(id,d){SEL.f=SEL.f||{};var c=+(SEL.f[id]||0);if(d>0&&fichas()>=3)return;if(d<0&&c<=0)return;SEL.f[id]=c+d;document.getElementById('f_'+id).textContent=SEL.f[id];document.getElementById('pozo').innerHTML=pozo();guardarBorrador();};
  h('<div class="card">'+cabecera(s)+'<p class="muted">Califiquen <b>cada carta</b> con las cinco preguntas (Sí, Dudoso o No). Al final pongan sus <b>3 fichas</b> en las cartas con más «Sí» y mejor sustentadas: una ficha significa <i>esta competencia debería ser Core</i>. Pueden ponerlas todas en una carta, repartirlas o no apostar. Las apuestas se revelan a la vez.</p>'+estadoGrupal(s)+'</div>'+
   '<div class="pozo" id="pozo"></div>'+
   HZ.map(function(c){return '<div class="carta"><div class="cod">Carta '+c.id+' · Core más cercana: '+esc(c.near)+'</div><h3 style="margin:3px 0">'+esc(c.n)+'</h3><p class="muted" style="font-size:14px;margin:4px 0 6px">'+esc(c.d)+'</p><p style="font-size:13px;color:#7A4310;margin:0 0 6px"><i>Para pensar:</i> '+esc(c.pp)+'</p>'+
     HQ.map(function(q,i){return '<div class="row5"><span><b>'+(i+1)+'. '+q.n+'</b><br><small style="color:var(--suave)">'+esc(q.p)+'</small></span><div class="seg">'+opt('hq_'+c.id,i,'S','Sí','S')+opt('hq_'+c.id,i,'D','Dudoso','D')+opt('hq_'+c.id,i,'N','No','N')+'</div></div>';}).join('')+
     '<div class="si" id="si_'+c.id+'"></div><label class="f" style="margin-top:8px">Por qué ponemos (o no) fichas aquí</label><input type="text" id="r_'+c.id+'" maxlength="300" placeholder="Una línea">'+
     '<div class="fichas-carta"><b style="color:var(--navy)">Fichas en esta carta</b><div class="stepper"><button type="button" onclick="hzStep(\''+c.id+'\',-1)">−</button><b id="f_'+c.id+'">0</b><button type="button" onclick="hzStep(\''+c.id+'\',1)">+</button></div></div></div>';}).join('')+
   '<div class="card" style="margin-top:12px">'+pie('Enviar apuesta de la mesa')+'</div>');
  window.trasElegir=function(g){if(g.indexOf('hq_')===0){var id=g.slice(3);document.getElementById('si_'+id).textContent=cuentaSi(id)+' de 5 en «Sí»';}};
  window.trasRestaurar=function(){HZ.forEach(function(h){document.getElementById('f_'+h.id).textContent=+((SEL.f||{})[h.id]||0);document.getElementById('si_'+h.id).textContent=cuentaSi(h.id)+' de 5 en «Sí»';});document.getElementById('pozo').innerHTML=pozo();};
  DRAFT_KEY='horizon';restaurarBorrador();window.trasRestaurar();};
R.mercado=function(s){
  h('<div class="card">'+cabecera(s)+'<p class="muted">Piensa en <b>tu filial</b>: de las cinco competencias de futuro, ¿cuáles necesitas como Core <b>desde ya</b> en tu negocio y cuáles se quedan como capacidades de futuro?</p>'+
   HZ.map(function(c,i){return '<div class="item"><div class="q"><span class="num">'+(i+1)+'</span><span><span style="color:var(--naranja);font-size:12px;font-weight:800">'+c.id+'</span><br>'+esc(c.n)+'</span></div><div class="two">'+opt('m',c.id,'core','Core ya en mi filial')+opt('m',c.id,'futuro','Se queda como futuro')+'</div></div>';}).join('')+
   '<label class="f">¿Por qué? (opcional)</label>'+ta('mnota','Lo que hace urgente una competencia en tu negocio',300)+pie()+'</div>');
  DRAFT_KEY='mercado';restaurarBorrador();};
R.compromisos=function(s){
  var blk=function(id,t,sub){return '<h3 style="margin-top:16px">'+t+'</h3><p class="muted" style="font-size:13.5px;margin:0">'+sub+'</p><label class="f">Responsable en '+esc(REG.filial)+'</label><input type="text" id="'+id+'r" maxlength="100" placeholder="Nombre o cargo"><label class="f">Fecha compromiso</label><input type="date" id="'+id+'p">';};
  h('<div class="card">'+cabecera(s)+'<p class="muted">Quién hace qué y para cuándo en tu filial. Cada participante confirma aquí.</p>'+
   blk('l','Quantum Lead','Sesión propia de validación.')+blk('f','Quantum Flow','Cómo cada negocio y proceso genera valor.')+blk('m','Quantum Mastery','Excelencia funcional y técnica.')+
   '<label class="f">Otro compromiso de mi filial (opcional)</label>'+ta('otro','Algo más que tu filial se compromete a hacer',300)+pie('Confirmar compromisos')+'</div>');
  DRAFT_KEY='compromisos';restaurarBorrador();};

  h('<div class="card">'+cabecera(s)+'<p class="muted">Cada gerente comparte dos cosas y, si quiere, un compromiso personal.</p>'+
   '<label class="f">Lo que me llevo</label>'+ta('llevo','Una idea, una certeza o una pregunta',300)+
   '<label class="f">Lo que cambio en mi filial</label>'+ta('cambio','Una acción concreta',300)+
   '<label class="f">Mi compromiso personal (opcional)</label>'+ta('comp','Qué haré y para cuándo',300)+pie()+'</div>');
  DRAFT_KEY='aprendizajes';restaurarBorrador();};
R.fin=function(){esperar('¡Gracias por participar!','Tras el taller recibirán el informe de resultados de la sala digital.');};

/* ===================== ENVÍO ===================== */
window.enviarForm=function(){
  var s=SEC[secIdx(REG?vistaActual():'registro')],err=document.getElementById('err');err.textContent='';
  var fila={actividad:actOf(s),momento:s.m||null,mesa:REG?REG.mesa:null,nombre:REG?REG.nombre:null,filial:REG?REG.filial:null,datos:{}},clave=s.k;
  if(s.k==='registro'){var n=val('r_nom'),c=val('r_car'),f=val('r_fil'),m=(SEL.reg||{}).mesa;
    if(n.length<3){err.textContent='Escribe tu nombre.';return;}if(c.length<2){err.textContent='Escribe tu cargo.';return;}if(!f){err.textContent='Selecciona tu filial.';return;}if(!m){err.textContent='Elige el color de tu PIN.';return;}
    fila={actividad:'registro',mesa:+m,nombre:n,filial:f,datos:{cargo:c}};}
  var integrantes=REG?miembrosMesa(REG.mesa).map(function(x){return x.nombre;}):[];
  if(s.tipo==='grupal'){fila.nombre=REG.nombre;fila.filial=null;fila.datos.integrantes=integrantes;fila.datos.filiales=miembrosMesa(REG.mesa).map(function(x){return x.filial;});}
  if(s.k==='conexion'){var fr=val('frase');if(fr.length<5){err.textContent='Escriban la frase común de la mesa.';return;}fila.datos.frase=fr;fila.datos.relatoria=val('rel');}
  if(s.k==='tensiones'||s.k==='tensiones_c'){var t=SEL.t||{};if(!t[0]||!t[1]||!t[2]){err.textContent='Califica las tres afirmaciones.';return;}fila.datos={r:[+t[0],+t[1],+t[2]],cargo:REG.cargo};}
  if(s.k==='vf'){var v=SEL.v||{};if(Object.keys(v).length<4){err.textContent='Responde las cuatro afirmaciones.';return;}fila.datos={r:[0,1,2,3].map(function(i){return v[i]==='V';})};}
  if(s.k==='core'){
    if(CI===5){var op=(SEL.cierre||{}).op;if(!op){err.textContent='Marquen una opción.';return;}if(val('cporque').length<3){err.textContent='Escriban por qué.';return;}fila.datos.comp='CIERRE';fila.datos.opcion=op;fila.datos.porque=val('cporque');clave='core_cierre';}
    else{var cc=CORE[CI],sc=SEL.c||{},cr={};
      for(var i=0;i<CRIT.length;i++){var k=CRIT[i].k;if(!sc[k]){err.textContent='Califiquen el criterio '+CRIT[i].n+'.';return;}var su=val('s_'+k);if(sc[k]!=='C'&&su.length<3){err.textContent='Escriban por qué en '+CRIT[i].n+' (no es «cumple»).';return;}cr[k]={v:sc[k],s:su};}
      fila.datos.comp=cc.id;fila.datos.criterios=cr;clave='core_'+cc.id;}}
  if(s.k==='horizon'){var F=SEL.f||{},tot=0,cartas={};
    for(var j=0;j<HZ.length;j++){var c2=HZ[j],q=SEL['hq_'+c2.id]||{},nf=+(F[c2.id]||0);tot+=nf;
      for(var i2=0;i2<5;i2++)if(!q[i2]){err.textContent='Respondan las cinco preguntas de la carta '+c2.id+'.';return;}
      if(nf>0&&val('r_'+c2.id).length<3){err.textContent='Escriban por qué ponen fichas en '+c2.id+'.';return;}
      cartas[c2.id]={fichas:nf,razon:val('r_'+c2.id),preguntas:[0,1,2,3,4].map(function(x){return q[x];})};}
    if(tot<3&&!confirmarNoApuesta()){err.innerHTML='Pusieron '+tot+' de 3 fichas. Si es su decisión, toquen de nuevo «Enviar».';return;}
    fila.datos.cartas=cartas;fila.datos.fichas=tot;}
  if(s.k==='mercado'){var M=SEL.m||{};if(Object.keys(M).length<HZ.length){err.textContent='Marca las cinco competencias.';return;}fila.datos={sel:M,nota:val('mnota')};}
  if(s.k==='compromisos'){if(!val('lr')||!val('fr')||!val('mr')){err.textContent='Indica los responsables de Lead, Flow y Mastery.';return;}if(!val('lp')||!val('fp')||!val('mp')){err.textContent='Indica las fechas de compromiso.';return;}
    fila.datos={lead_resp:val('lr'),lead_fecha:val('lp'),flow_resp:val('fr'),flow_fecha:val('fp'),mastery_resp:val('mr'),mastery_fecha:val('mp'),otro:val('otro'),cargo:REG.cargo};}
  if(s.k==='aprendizajes'){if(val('llevo').length<3||val('cambio').length<3){err.textContent='Completa lo que te llevas y lo que cambias.';return;}fila.datos={llevo:val('llevo'),cambio:val('cambio'),compromiso:val('comp'),cargo:REG.cargo};}
  var bt=document.getElementById('go');bt.disabled=true;bt.textContent='Enviando…';
  enviar(fila).then(function(){
    if(s.k==='registro'){REG={nombre:fila.nombre,cargo:fila.datos.cargo,filial:fila.filial,mesa:fila.mesa};ls('reg',REG);EST.miembros.push({pid:PID,nombre:REG.nombre,filial:REG.filial,cargo:REG.cargo,mesa:REG.mesa});ls('draft_registro',null);render(true);return;}
    ls('draft_'+clave,null);
    if(s.k==='core'){EST.grupales.push({a:'core',m:REG.mesa,c:fila.datos.comp});var done=EST.grupales.filter(function(g){return g.a==='core'&&g.m==REG.mesa;}).map(function(g){return g.c;});
      var next=CORE.findIndex(function(x){return done.indexOf(x.id)<0;});CI=next>=0?next:(done.indexOf('CIERRE')<0?5:CI);ls('core_tab',CI);
      if(next<0&&done.indexOf('CIERRE')>=0){HECHO.core=true;ls('hecho',HECHO);}render(true);return;}
    if(s.tipo==='grupal')EST.grupales.push({a:s.k,m:REG.mesa,c:null});
    HECHO[s.k]=true;delete EDITANDO[s.k];ls('hecho',HECHO);render(true);
  }).catch(function(e){bt.disabled=false;bt.textContent='Reintentar';err.textContent='No se pudo enviar. Tu respuesta sigue guardada en este celular; inténtalo de nuevo. ('+String(e.message||e).slice(0,60)+')';});
};
var NOAPUESTA=0;function confirmarNoApuesta(){NOAPUESTA++;return NOAPUESTA>1;}

/* ===================== CICLO ===================== */
var ULTIMA='';
function render(forzar){
  var k=REG?vistaActual():'registro',s=SEC[secIdx(k)];
  var firma=k+'|'+(REG?'r':'')+'|'+CTRL.volver+'|'+(REG?JSON.stringify(lider(REG.mesa))+miembrosMesa(REG.mesa).length:'')+'|'+CI;
  if(!forzar&&firma===ULTIMA){var e=document.querySelector('.estado');if(e){e.className='estado'+(CONECTADO?'':' off');e.lastChild.textContent=CONECTADO?'Conectado a la sala':'Sin conexión · tus respuestas quedan guardadas en este celular';}return;}
  ULTIMA=firma;
  if(!REG){R.registro(s);return;}
  if(k==='registro'){R.registro(s);return;}
  if(k!=='fin'&&k!=='core'&&s.tipo==='individual'&&hecho(k)&&!EDITANDO[k]){yaEnviado(s);return;}
  if(s.tipo==='grupal'&&k!=='core'&&!EDITANDO[k]&&EST.grupales.some(function(g){return g.a===k&&g.m==REG.mesa;})&&soyLider()){yaEnviado(s);return;}
  if(k==='core'&&soyLider()&&!EDITANDO.core){var d=EST.grupales.filter(function(g){return g.a==='core'&&g.m==REG.mesa;}).map(function(g){return g.c;});if(CORE.every(function(x){return d.indexOf(x.id)>=0;})&&d.indexOf('CIERRE')>=0){yaEnviado(s);return;}}
  window.scrollTo(0,0);R[k](s);
}
var ACT_PREV=ls('act_prev');
function ciclo(){consultar().then(function(){
  if(CTRL.actual!==ACT_PREV){ACT_PREV=CTRL.actual;ls('act_prev',ACT_PREV);VISTA=null;ls('vista',null);}
  if(!CTRL.volver&&VISTA){VISTA=null;ls('vista',null);}
  render(false);});}
render(true);ciclo();setInterval(ciclo,CONSULTA_MS);
window.addEventListener('storage',function(e){if(DEMO&&/quantum_demo/.test(e.key||''))ciclo();});
